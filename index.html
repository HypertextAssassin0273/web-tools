<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web-tools</title>
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <script>
      try {
        const store = JSON.parse(localStorage.getItem('web-tools')) || {};
        const theme = store.config?.theme || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  
  <!-- Add base background colors so it paints correctly before React mounts -->
  <body class="bg-gray-50 dark:bg-gray-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
